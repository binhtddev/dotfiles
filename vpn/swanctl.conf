# TMA internal IPsec VPN (FortiGate) - swanctl profile template.
#
# Do not edit this file to add secrets: setup.sh renders it to
# /etc/swanctl/tma.conf, filling in the __PLACEHOLDER__ values from its
# environment (see README.md).
connections {
    fortigate {
        version = 2
        remote_addrs = __GATEWAY__
        proposals = aes128-sha256-prfsha256-ecp521
        vips = 0.0.0.0
        fragmentation = yes
        mobike = no

        local {
            auth = pubkey
            certs = client.pem
            id = "__LOCAL_ID__"
        }

        remote {
            auth = pubkey
            id = "CN=*.tma.com.vn"
        }

        children {
            net {
                local_ts = dynamic
                remote_ts = __REMOTE_TS__
                esp_proposals = aes128-sha256-ecp521
                start_action = none
            }
        }
    }
}

secrets {
    private-key {
        file = client.key
    }
}
